<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Flexbox 1 - Gambar 8(a)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', serif;
            font-size: 16px;
        }

        body {
            display: flex;
            min-height: 100vh;
        }

        /* Kolom Kiri Penuh */
        nav {
            width: 22%;
            background-color: #f8c8d4;
            padding: 20px;
        }

        /* Wrapper Sisi Kanan */
        .main-wrapper {
            width: 78%;
            display: flex;
            flex-direction: column;
        }

        header, footer {
            background-color: #f1ea8c;
            height: 90px;
            padding: 20px;
        }

        .content-area {
            flex: 1; /* Mengisi sisa tinggi di antara header dan footer */
            display: flex;
        }

        article {
            width: 72%;
            background-color: #ffffff;
            padding: 20px;
        }

        aside {
            width: 28%;
            background-color: #1ff2f2;
            padding: 20px;
        }
    </style>
</head>
<body>
    <nav>Nav</nav>
    <div class="main-wrapper">
        <header>Header</header>
        <div class="content-area">
            <article>Article</article>
            <aside>Aside</aside>
        </div>
        <footer>Footer</footer>
    </div>
</body>
</html>

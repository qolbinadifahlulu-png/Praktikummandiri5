<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout - Gambar 7</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .gallery-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .box {
            flex: 1; /* Membagi lebar kolom sama rata secara otomatis */
            height: 70px;
            background-color: #dcdcdc;
            border: 2.5px solid #222;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Jika ingin memasukkan tag <img> di dalam .box */
        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <!-- Baris 1: 3 Kotak -->
        <div class="row">
            <div class="box"<img src="/img/20261118_083127.jpg" alt="foto1"</div>
            <div class="box"<img src="/img/20261118_100219.jpg" alt="foto2"</div>
            <div class="box"<img src="/img/20261118_100225.jpg" alt="foto3"</div>
        </div>

        <!-- Baris 2: 5 Kotak -->
        <div class="row">
            <div class="box"<img src="/img/IMG-20261117-WA0018.jpg" alt="foto4"</div>
            <div class="box"<img src="/img/IMG-20261117-WA0022.jpg" alt="foto5"</div>
            <div class="box"<img src="/img/IMG-20261117-WA0029.jpg" alt="foto6"</div>
            <div class="box"<img src="/img/IMG-20261117-WA0030.jpg" alt="foto7"</div>
            <div class="box"<img src="/img/IMG-20261119-WA0007.jpg" alt="foto8"</div>
        </div>
    </div>
</body>
</html>

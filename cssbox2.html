<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Kotak Hijau Atas */
        .header-green {
            width: 100%;
            height: 80px;
            background-color: #a8d684;
            border: 1.5px solid #333;
            margin-bottom: 20px;
        }

        /* Baris Konten */
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Kotak Kuning Kiri */
        .box-yellow {
            width: 22%;
            height: 150px;
            background-color: #f4ea3c;
            border: 1.5px solid #333;
        }

        /* Kotak Oranye Kanan */
        .box-orange {
            width: 78%;
            height: 150px;
            background-color: #f6621c;
            border: 1.5px solid #333;
        }

        /* Kotak Biru Muda Kanan */
        .box-blue {
            width: 78%;
            height: 150px;
            background-color: #4dd0f8;
            border: 1.5px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Bagian Atas -->
        <div class="header-green"></div>

        <!-- Baris Tengah -->
        <div class="row">
            <div class="box-yellow"></div>
            <div class="box-orange"></div>
        </div>

        <!-- Baris Bawah -->
        <div class="row">
            <div class="box-yellow"></div>
            <div class="box-blue"></div>
        </div>
    </div>
</body>
</html>

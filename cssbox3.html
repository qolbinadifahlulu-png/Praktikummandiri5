<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box 3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Bagian Atas */
        .top-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .box-yellow {
            width: 20%;
            height: 60px;
            background-color: #f4ea3c;
            border: 1.5px solid #333;
        }

        .box-orange {
            width: 80%;
            height: 60px;
            background-color: #f6621c;
            border: 1.5px solid #333;
        }

        /* Bagian Tengah (3 Kolom) */
        .middle-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .col-green {
            width: 20%;
            height: 380px;
            background-color: #a8d684;
            border: 1.5px solid #333;
        }

        .col-gray {
            width: 60%;
            height: 380px;
            background-color: #cccccc;
            border: 1.5px solid #333;
        }

        .col-cyan {
            width: 20%;
            height: 380px;
            background-color: #4dd0f8;
            border: 1.5px solid #333;
        }

        /* Bagian Bawah */
        .footer-blue {
            width: 100%;
            height: 60px;
            background-color: #1665e8;
            border: 1.5px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Baris Atas -->
        <div class="top-row">
            <div class="box-yellow"></div>
            <div class="box-orange"></div>
        </div>

        <!-- Baris Tengah -->
        <div class="middle-row">
            <div class="col-green"></div>
            <div class="col-gray"></div>
            <div class="col-cyan"></div>
        </div>

        <!-- Baris Bawah -->
        <div class="footer-blue"></div>
    </div>
</body>
</html>
